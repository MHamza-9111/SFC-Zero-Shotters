<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>DineIQ Intelligence — Award-Winning Restaurant AI Platform</title>
<meta name="description" content="DineIQ Analytics — Next-Generation Apple Intelligence Powered Restaurant Analytics & Dual-Pipeline ML Platform."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  /* ── APPLE INTELLIGENCE & AWWWARDS LUXURY DARK PALETTE ─────────────── */
  --bg-void:#030307;
  --bg-base:#070710;
  --bg-panel:rgba(15,15,26,0.72);
  --bg-panel-2:rgba(22,22,38,0.85);
  --bg-panel-3:rgba(30,30,50,0.9);
  --bg-panel-hover:rgba(35,35,58,0.95);
  
  --line:rgba(255,255,255,0.08);
  --line-strong:rgba(255,255,255,0.16);
  --line-glow:rgba(168,85,247,0.3);

  --ai-purple:#A855F7;
  --ai-pink:#EC4899;
  --ai-blue:#3B82F6;
  --ai-cyan:#06B6D4;
  --ai-aura:linear-gradient(135deg, #A855F7 0%, #EC4899 50%, #3B82F6 100%);
  --ai-aura-gold:linear-gradient(135deg, #F59E0B 0%, #E11D48 50%, #A855F7 100%);
  
  --gold:#F5D061;
  --gold-glow:rgba(245,208,97,0.25);
  --gold-deep:#B88B2A;
  
  --emerald:#10B981;
  --emerald-glow:rgba(16,185,129,0.25);
  --emerald-deep:#059669;

  --ruby:#EF4444;
  --ruby-glow:rgba(239,68,68,0.25);
  --amber:#F59E0B;
  --amber-glow:rgba(245,158,11,0.25);

  --text-main:#F8FAFC;
  --text-sub:#94A3B8;
  --text-muted:#64748B;
  --text-dark:#334155;

  --font-display:'Syne','Plus Jakarta Sans',system-ui,sans-serif;
  --font-ui:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;

  --r-sm:8px;
  --r-md:14px;
  --r-lg:20px;
  --r-xl:28px;

  --glass-blur:blur(24px) saturate(180%);
  --sh-panel:0 20px 50px -10px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
  --sh-glow:0 0 30px rgba(168,85,247,0.2);
  --sh-glow-gold:0 0 30px rgba(245,208,97,0.2);

  --ease-spring:cubic-bezier(0.16, 1, 0.3, 1);
}

html[data-theme="light"]{
  --bg-void:#F1F5F9;
  --bg-base:#F8FAFC;
  --bg-panel:rgba(255,255,255,0.85);
  --bg-panel-2:rgba(241,245,249,0.9);
  --bg-panel-3:rgba(226,232,240,0.95);
  --bg-panel-hover:#FFFFFF;
  --line:rgba(0,0,0,0.08);
  --line-strong:rgba(0,0,0,0.16);
  --text-main:#0F172A;
  --text-sub:#475569;
  --text-muted:#64748B;
  --sh-panel:0 10px 30px -5px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.8);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:var(--bg-void);color:var(--text-main);font-family:var(--font-ui);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden;}

/* ── AMBIENT APPLE INTELLIGENCE AURA BACKGROUND ──────────────────── */
body::before{
  content:'';
  position:fixed;
  top:-20vh;
  left:-10vw;
  width:120vw;
  height:120vh;
  background:
    radial-gradient(circle at 20% 20%, rgba(168,85,247,0.12) 0%, transparent 40%),
    radial-gradient(circle at 80% 30%, rgba(236,72,153,0.10) 0%, transparent 45%),
    radial-gradient(circle at 50% 80%, rgba(59,130,246,0.12) 0%, transparent 50%),
    radial-gradient(circle at 70% 90%, rgba(245,208,97,0.08) 0%, transparent 40%);
  filter:blur(60px);
  pointer-events:none;
  z-index:0;
  animation:auraBreathing 18s ease-in-out infinite alternate;
}

@keyframes auraBreathing{
  0%{transform:scale(1) rotate(0deg);}
  50%{transform:scale(1.08) rotate(3deg);}
  100%{transform:scale(0.95) rotate(-3deg);}
}

/* ── TYPOGRAPHY & GRADIENTS ───────────────────────────────────────── */
h1,h2,h3,h4,.title-font{font-family:var(--font-display);letter-spacing:-0.02em;}
.grad-text{background:var(--ai-aura);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.grad-text-gold{background:linear-gradient(135deg, #FFE89C 0%, #F5D061 50%, #C9961A 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.grad-text-emerald{background:linear-gradient(135deg, #A7F3D0 0%, #10B981 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

/* ── BUTTONS ──────────────────────────────────────────────────────── */
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;outline:none;}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:8px 16px;
  border-radius:var(--r-sm);
  font-weight:600;
  font-size:12px;
  cursor:pointer;
  transition:all 0.25s var(--ease-spring);
  border:1px solid var(--line);
  background:rgba(255,255,255,0.04);
  color:var(--text-main);
  backdrop-filter:blur(10px);
}
.btn:hover{
  background:rgba(255,255,255,0.08);
  border-color:var(--line-strong);
  transform:translateY(-1px);
  box-shadow:0 6px 20px rgba(0,0,0,0.3);
}
.btn.gold{
  background:var(--ai-aura-gold);
  border:none;
  color:#000;
  font-weight:700;
  box-shadow:var(--sh-glow-gold);
}
.btn.gold:hover{
  transform:translateY(-2px) scale(1.02);
  box-shadow:0 8px 30px rgba(245,208,97,0.4);
}
.btn.ai-aura{
  background:var(--ai-aura);
  border:none;
  color:#FFF;
  font-weight:700;
  box-shadow:var(--sh-glow);
}
.btn.ai-aura:hover{
  transform:translateY(-2px) scale(1.02);
  box-shadow:0 8px 30px rgba(168,85,247,0.4);
}
.btn.sm{padding:5px 11px;font-size:11px;border-radius:6px;}
.btn.wide{width:100%;}
.btn.ghost{background:transparent;border-color:var(--line);}

/* ── CARDS & PANELS ───────────────────────────────────────────────── */
.panel{
  background:var(--bg-panel);
  backdrop-filter:var(--glass-blur);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  box-shadow:var(--sh-panel);
  padding:20px;
  position:relative;
  overflow:hidden;
  transition:border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s var(--ease-spring);
}
.panel:hover{
  border-color:var(--line-strong);
}
.panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
  gap:12px;
}
.panel-title{
  font-family:var(--font-display);
  font-size:16px;
  font-weight:700;
  color:var(--text-main);
  display:flex;
  align-items:center;
  gap:8px;
}
.panel-sub{
  font-size:11px;
  color:var(--text-sub);
  margin-top:2px;
}

/* ── GRID SYSTEM ──────────────────────────────────────────────────── */
.grid{display:grid;gap:16px;}
.g1{grid-template-columns:1fr;}
.g2{grid-template-columns:repeat(2,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}
.g6{grid-template-columns:repeat(6,1fr);}
.g12{grid-template-columns:repeat(12,1fr);}
@media(max-width:1150px){.g6,.g4,.g3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:768px){.g6,.g4,.g3,.g2{grid-template-columns:1fr;}}

/* ── KPI CARDS ────────────────────────────────────────────────────── */
.kpi-card{
  background:var(--bg-panel-2);
  border:1px solid var(--line);
  border-radius:var(--r-md);
  padding:16px;
  position:relative;
  transition:all 0.3s var(--ease-spring);
}
.kpi-card:hover{
  border-color:var(--line-glow);
  transform:translateY(-2px);
  box-shadow:var(--sh-glow);
}
.kpi-lbl{font-size:11px;color:var(--text-sub);font-weight:500;}
.kpi-val{font-family:var(--font-display);font-size:24px;font-weight:800;color:var(--text-main);margin:6px 0 2px;}
.kpi-sub{font-size:10px;color:var(--text-muted);}

/* ── TAGS & BADGES ────────────────────────────────────────────────── */
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 9px;
  border-radius:20px;
  font-size:10.5px;
  font-weight:600;
  border:1px solid var(--line);
  background:rgba(255,255,255,0.04);
}
.tag.em{background:rgba(16,185,129,0.12);color:var(--emerald);border-color:rgba(16,185,129,0.3);}
.tag.ox,.tag.ruby{background:rgba(239,68,68,0.12);color:var(--ruby);border-color:rgba(239,68,68,0.3);}
.tag.gold,.tag.amber{background:rgba(245,208,97,0.12);color:var(--gold);border-color:rgba(245,208,97,0.3);}
.tag.purple,.tag.ai{background:rgba(168,85,247,0.12);color:var(--ai-purple);border-color:rgba(168,85,247,0.3);}

/* ── TABS NAV ─────────────────────────────────────────────────────── */
.tabs-wrap{
  display:flex;
  align-items:center;
  gap:6px;
  background:var(--bg-panel-2);
  padding:5px;
  border-radius:var(--r-md);
  border:1px solid var(--line);
  margin-bottom:20px;
  overflow-x:auto;
}
.tab-btn{
  padding:8px 16px;
  border-radius:var(--r-sm);
  font-size:12px;
  font-weight:600;
  color:var(--text-sub);
  cursor:pointer;
  transition:all 0.2s ease;
  white-space:nowrap;
  display:flex;
  align-items:center;
  gap:6px;
}
.tab-btn:hover{color:var(--text-main);background:rgba(255,255,255,0.04);}
.tab-btn.act{
  background:var(--ai-aura);
  color:#FFF;
  font-weight:700;
  box-shadow:var(--sh-glow);
}

/* ── TABLES ───────────────────────────────────────────────────────── */
.table-wrap{width:100%;overflow-x:auto;}
table.t{width:100%;border-collapse:collapse;font-size:12px;}
table.t th{text-align:left;padding:10px 12px;color:var(--text-sub);font-weight:600;font-size:11px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:0.04em;}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--text-main);}
table.t tr:hover td{background:rgba(255,255,255,0.02);}

/* ── NOTE & ALERT BOXES ───────────────────────────────────────────── */
.note-box{
  background:rgba(168,85,247,0.06);
  border:1px solid rgba(168,85,247,0.2);
  border-radius:var(--r-md);
  padding:12px 16px;
  font-size:11.5px;
  color:var(--text-sub);
  display:flex;
  align-items:flex-start;
  gap:10px;
  margin-top:14px;
}

.mono{font-family:var(--font-mono);}
.mb{margin-bottom:20px;}
.sep{height:1px;background:var(--line);margin:16px 0;}
</style>
</head>
