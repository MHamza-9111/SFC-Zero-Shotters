services:
  - type: web
    name: sfc-zero-shotters
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: waitress-serve --listen=0.0.0.0:$PORT wsgi:app
    healthCheckPath: /health
    envVars:
      - key: DINEIQ_ENV
        value: production
      - key: DINEIQ_AUTH_REQUIRED
        value: "true"
