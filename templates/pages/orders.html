<section class="view" id="view-orders" data-title="Orders">
          <div class="view-heading"><div><div class="eyebrow">Operations</div><h2>Orders</h2><p>Search, filter and inspect recorded orders.</p></div></div>
          <div class="grid g3 kpi-grid" id="orders-kpis"></div>
          <section class="card"><div class="card-head"><div><h3 class="card-title">Order register</h3><div class="card-sub">Filters apply to the loaded transaction records.</div></div></div>
            <div class="filter-row"><label class="sr-only" for="orders-q">Search orders</label><input class="control" id="orders-q" type="search" placeholder="Search order or customer"><label class="sr-only" for="orders-status">Order status</label><select class="control" id="orders-status"><option value="">All statuses</option></select><label class="sr-only" for="orders-channel">Order channel</label><select class="control" id="orders-channel"><option value="">All channels</option></select><label class="sr-only" for="orders-payment">Payment method</label><select class="control" id="orders-payment"><option value="">All payments</option></select><label class="sr-only" for="orders-sort">Sort orders</label><select class="control" id="orders-sort"><option value="recent">Most recent</option><option value="amount_desc">Highest value</option><option value="amount_asc">Lowest value</option></select><button class="btn btn-ghost" id="orders-clear" type="button">Clear</button></div>
            <div class="table-wrap"><table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Location</th><th>Channel</th><th>Payment</th><th class="num">Total</th><th>Status</th><th>Date</th></tr></thead><tbody id="orders-tbody"></tbody></table></div><div class="pager" id="orders-pager"></div>
          </section>
        </section>
