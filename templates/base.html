<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="{% block meta_description %}DineIQ Analytics — restaurant intelligence platform with dual ML pipelines, demand forecasting, and menu intelligence.{% endblock %}">
  <title>{% block title %}DineIQ Analytics{% endblock %}</title>
  <script src="{{ url_for('static', filename='js/theme-boot.js') }}?v=3"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke-linecap='round'%3E%3Cg transform='rotate(32 12 12)' stroke='%23fbbf24' stroke-width='2'%3E%3Cpath d='M8.6 2.8v4.4a3.4 3.4 0 0 0 6.8 0V2.8M12 2.8v18.4'/%3E%3C/g%3E%3Cg transform='rotate(-32 12 12)' stroke='%232dd4bf' stroke-width='2'%3E%3Cpath d='M8.6 2.8v4.4a3.4 3.4 0 0 0 6.8 0V2.8M12 2.8v18.4'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v=3">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}?v=3">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages.css') }}?v=3">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}?v=3">
  {% block head_extra %}{% endblock %}
</head>
<body{% block body_class %}{% endblock %}>
  <div class="aurora" aria-hidden="true"></div>
  <div class="loadbar" id="loadbar" aria-hidden="true"></div>
  <a class="skip-link" href="#main-content">Skip to content</a>
  {% include "components/icons.html" %}
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
