

<nav class="nav side-nav" id="nav" aria-label="Main navigation">
  {% for group, items in navigation %}
  <div class="nav-group-label">{{ group }}</div>
  {% for view, label, icon, href in items %}
  <a class="nav-item" data-view="{{ view }}" href="{{ href }}"><svg><use href="#i-{{ icon }}"/></svg><span>{{ label }}</span></a>
  {% endfor %}
  {% endfor %}
</nav>
