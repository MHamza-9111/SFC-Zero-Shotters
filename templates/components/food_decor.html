<style>
.food-decor {

}
.food-item {

  will-change: transform;
}
.food-svg {
  animation: antigravity 6s ease-in-out infinite alternate;
  animation-delay: var(--d, 0s);
  filter: drop-shadow(0 20px 30px rgba(251, 191, 36, 0.5)) drop-shadow(0 0 15px rgba(45, 212, 191, 0.4)) brightness(1.2);
}
@keyframes antigravity {
  0% { transform: translateY(0) rotate(0deg) scale(1); }
  50% { transform: translateY(-25px) rotate(15deg) scale(1.15); filter: drop-shadow(0 30px 40px rgba(251, 191, 36, 0.7)) drop-shadow(0 0 25px rgba(45, 212, 191, 0.6)) brightness(1.35); }
  100% { transform: translateY(15px) rotate(-10deg) scale(1.05); }
}
</style>
